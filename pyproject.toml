[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shortlink"
version = "0.1.0"
description = "Production-shaped URL shortener with analytics, caching and rate limiting."
requires-python = ">=3.12"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: isort, B: bugbear, UP: pyupgrade, ASYNC: flake8-async
select = ["E", "F", "I", "B", "UP", "ASYNC", "C4"]
ignore = ["B008"]  # FastAPI 依赖注入大量使用 Depends() 作为默认值

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_redundant_casts = true
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
